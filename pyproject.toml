[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detoxbench"
version = "0.2.0"
description = "ConformWeb contract-grounded behavioral evaluator for generated web apps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.44",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
generation = [
  "openai>=1.40",
]

[project.scripts]
conformweb = "detoxbench.cli:main"
detoxbench = "detoxbench.cli:main"

[tool.setuptools.packages.find]
include = ["detoxbench*"]

[tool.setuptools.package-data]
detoxbench = ["dashboard_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
